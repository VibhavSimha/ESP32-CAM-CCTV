<!DOCTYPE html><html><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ESP32-CAM Live</title>
    <style>
      body{margin:0;background:#0d1117;color:#c9d1d9;font-family:system-ui;
           display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
      img{max-width:100%;border:2px solid #30363d;border-radius:8px}
      #st{margin-top:12px;font-family:monospace;color:#3fb950}
      button{margin-top:10px;padding:8px 16px;border-radius:6px;border:1px solid #30363d;
             background:#161b22;color:#c9d1d9;cursor:pointer}
    </style></head><body>
      <img id="cam" alt="Loading…">
      <div id="st">Resolving current tunnel…</div>
      <button onclick="load()">Reconnect</button>
    <script>
    // --- fill these two in (anon key is safe to expose) ---
    const SUPABASE_URL = "https://biuijfruddgtuefrsxnq.supabase.co";
    const ANON_KEY = "sb_publishable_VgBBx8SdC4-ny1H8ovqoIg_5zC0Hepk";
    
    async function load(){
      const st = document.getElementById('st');
      st.textContent = "Resolving current tunnel…";
      try{
        // latest row only
        const r = await fetch(
          `${SUPABASE_URL}/rest/v1/camera_status?select=url&order=created_at.desc&limit=1`,
          { headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY } });
        const rows = await r.json();
        if(!rows.length){ st.textContent = "No tunnel URL published yet."; return; }
        const base = rows[0].url.replace(/\/+$/,'');       // e.g. http://bore.pub:34819
        document.getElementById('cam').src = base + "/stream";
        st.textContent = "Live via " + base;
      }catch(e){ st.textContent = "Lookup failed: " + e; }
    }
    load();
    </script></body></html>
